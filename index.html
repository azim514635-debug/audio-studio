<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azim's Studio Pro</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f8fafc; padding: 20px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; }
    .brand-header { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
    .brand-header span { background: #6366f1; font-size: 11px; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.5px; }
    
    h2 { color: #38bdf8; font-size: 20px; margin-top: 30px; display: flex; align-items: center; gap: 8px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: #1e293b; padding: 10px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
    .card h3 { font-size: 14px; margin: 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card a { display: block; margin-top: 6px; background: #38bdf8; color: #0b0f19; padding: 6px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 13px; }
    .card a:hover { background: #0ea5e9; }
    
    .admin-section { background: #151c2c; padding: 20px; border-radius: 12px; margin-top: 40px; border: 1px solid #1e293b; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
    .admin-section h3 { color: #fbbf24; margin-top: 0; margin-bottom: 20px; }
    .admin-section h4 { color: #f8fafc; margin-bottom: 8px; font-size: 15px; }
    
    input { display: block; width: 100%; box-sizing: border-box; margin: 6px 0 14px; padding: 10px 12px; background: #0b0f19; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: #38bdf8; }
    
    button { background: #6366f1; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 8px; font-weight: bold; width: 100%; font-size: 14px; transition: background 0.2s; }
    button:hover { background: #4f46e5; }
    
    .empty-text { color: #64748b; font-size: 14px; margin: 5px 0 15px; }
    hr { border: 0; border-top: 1px solid #1e293b; margin: 25px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-header">Azim's Studio Pro <span>PRO</span></div>

    <h2>🎵 Songs</h2>
    <div id="songs-container" class="grid"><p class="empty-text">No songs available.</p></div>

    <h2>🎬 Movies</h2>
    <div id="movies-container" class="grid"><p class="empty-text">No movies available.</p></div>

    <h2>📂 External Links & Downloads</h2>
    <div id="links-container" class="grid"><p class="empty-text">No links available.</p></div>

    <div class="admin-section">
      <h3>🔒 Admin Panel (Uploads)</h3>
      
      <form action="/api/admin/song" method="POST">
        <h4>Upload Song</h4>
        <input type="text" name="title" placeholder="Enter song name..." required>
        <input type="text" name="thumbnailUrl" placeholder="Thumbnail Image URL" required>
        <input type="text" name="songUrl" placeholder="Song Stream/Audio URL" required>
        <input type="password" name="adminSecret" placeholder="Admin Password" required>
        <button type="submit">Add Song</button>
      </form>

      <hr>

      <form action="/api/admin/movie" method="POST">
        <h4>Upload Movie</h4>
        <input type="text" name="title" placeholder="Movie Title" required>
        <input type="text" name="thumbnailUrl" placeholder="Thumbnail Image URL" required>
        <input type="text" name="movieUrl" placeholder="Movie URL" required>
        <input type="password" name="adminSecret" placeholder="Admin Password" required>
        <button type="submit">Add Movie</button>
      </form>

      <hr>

      <form action="/api/admin/link" method="POST">
        <h4>Upload External Link (e.g., Download Link)</h4>
        <input type="text" name="title" placeholder="Link Title (e.g., Download Avengers Here)" required>
        <input type="text" name="thumbnailUrl" placeholder="Thumbnail Image URL" required>
        <input type="text" name="redirectUrl" placeholder="Destination Custom URL" required>
        <input type="password" name="adminSecret" placeholder="Admin Password" required>
        <button type="submit">Add External Link</button>
      </form>
    </div>
  </div>

  <script>
    fetch('/api/data')
      .then(res => res.json())
      .then(data => {
        const sContainer = document.getElementById('songs-container');
        if(data.songs.length > 0) {
          sContainer.innerHTML = data.songs.map(s => `
            <div class="card">
              <img src="${s.thumbnailUrl}" alt="${s.title}">
              <h3>${s.title}</h3>
              <a href="${s.songUrl}" target="_blank">Play Song</a>
            </div>
          `).join('');
        }

        const mContainer = document.getElementById('movies-container');
        if(data.movies.length > 0) {
          mContainer.innerHTML = data.movies.map(m => `
            <div class="card">
              <img src="${m.thumbnailUrl}" alt="${m.title}">
              <h3>${m.title}</h3>
              <a href="${m.movieUrl}" target="_blank">Watch Movie</a>
            </div>
          `).join('');
        }

        const lContainer = document.getElementById('links-container');
        if(data.links.length > 0) {
          lContainer.innerHTML = data.links.map(l => `
            <div class="card">
              <img src="${l.thumbnailUrl}" alt="${l.title}">
              <h3>${l.title}</h3>
              <a href="${l.redirectUrl}" target="_blank">Open Link</a>
            </div>
          `).join('');
        }
      });
  </script>
</body>
</html>
