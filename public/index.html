<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Studio</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --border-color: #1f2937;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    .header {
      margin-bottom: 24px;
      text-align: left;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      background-color: rgba(31, 41, 55, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .file-dropzone:hover {
      border-color: var(--accent);
      background-color: rgba(99, 102, 241, 0.05);
    }

    input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .dropzone-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .dropzone-label span {
      color: var(--accent);
      font-weight: 600;
    }

    .file-preview {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--success);
      font-weight: 500;
      word-break: break-all;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 16px;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    #statusMessage {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .track-card {
      background-color: rgba(31, 41, 55, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-card p {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
      word-break: break-all;
    }

    audio {
      width: 100%;
      height: 36px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Audio Studio</h1>
      <p>Upload and manage sound tracks</p>
    </div>
    
    <div class="card">
      <div class="card-title">Upload Track</div>
      <form onsubmit="uploadSong(event)">
        <div class="file-dropzone">
          <input type="file" id="songInput" accept="*/*" onchange="previewFileName()" required />
          <div class="dropzone-label">
            <span>Choose file</span> or drag here
          </div>
        </div>
        <div id="selectedFileName" class="file-preview"></div>
        <button type="submit" class="btn-submit">Upload Audio</button>
      </form>
      <p id="statusMessage"></p>
    </div>

    <div class="card">
      <div class="card-title">Library</div>
      <div id="playlist" class="track-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
