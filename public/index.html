<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Audio Studio</h1>
    <p class="subtitle">Upload and manage sound tracks</p>

    <!-- User Name Section -->
    <div class="card" id="user-section">
      <h3>Welcome</h3>
      <input type="text" id="username-input" placeholder="Enter your name">
      <button id="save-name-btn">Set Name</button>
      <p id="greeting-text"></p>
    </div>

    <!-- Track Upload Section -->
    <div class="card">
      <h3>Upload Track</h3>
      <form id="upload-form">
        <input type="file" id="audio-file" accept="audio/*" required>
        <button type="submit" id="upload-btn">Upload Audio</button>
      </form>
      <p id="upload-status"></p>
    </div>

    <!-- Track Library -->
    <div class="card">
      <h3>Library</h3>
      <ul id="track-list"></ul>
    </div>

    <!-- Request Form -->
    <div class="card">
      <h3>Request to Azim</h3>
      <textarea id="request-text" placeholder="Type your request here..."></textarea>
      <button id="send-request-btn">Send Request</button>
    </div>

    <!-- Footer -->
    <footer>
      <p>Website Created & Maintained by <strong>Azim</strong></p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
