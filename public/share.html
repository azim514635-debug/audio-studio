<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Azim's Space</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #12141d, #1e2130);
      color: #f4f5fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #ffffff12;
      border: 1px solid #ffffff24;
      border-radius: 18px;
      padding: 22px;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .poster {
      width: 100%;
      max-height: 320px;
      border-radius: 12px;
      background: #000;
    }
    img.poster { object-fit: contain; }
    video.poster { background: #000; }
    audio.poster {
      width: 100%;
      margin: 16px 0 4px;
    }
    h1 {
      font-size: 18px;
      margin: 14px 0 4px;
      word-break: break-word;
    }
    p { font-size: 13px; color: #cdd2e3; margin: 4px 0; }
    .brand {
      font-size: 12px;
      color: #7ae0ff;
      margin-top: 14px;
      letter-spacing: .3px;
    }
    a { color: #7ae0ff; text-decoration: none; }
    .spinner {
      margin: 30px auto;
      width: 34px; height: 34px;
      border: 3px solid #ffffff33;
      border-top-color: #7ae0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">Loading…</h1>
    <div class="spinner"></div>
    <div id="body"></div>
  </div>

  <script>
    (function () {
      var parts = location.pathname.replace(/\/+$/, '').split('/');
      var isDl = parts[0] === 'dl';
      var type = 'file';
      var id = '';
      if (parts[1]) {
        var t = parts[1].toLowerCase();
        if (t === 'video' || t === 'movie' || t === 'movies') { type = 'video'; }
        else if (t === 'audio') { type = 'audio'; }
        else { type = 'file'; }
      }
      id = parts[2] || '';
      var APIS = { video: '/api/movies', audio: '/api/tracks', file: '/api/links' };
      fetch(APIS[type] || '/api/links')
        .then(function (r) { return r.json(); })
        .then(function (items) {
          items = items || [];
          var item = null;
          for (var i = 0; i < items.length; i++) {
            if (items[i].id === id) { item = items[i]; break; }
          }
          if (!item) { renderNotFound(); return; }
          renderItem(item);
        })
        .catch(function () { renderNotFound(); });

      function renderNotFound() {
        document.getElementById('title').textContent = 'Not found';
        document.getElementById('body').innerHTML = '<p>This item may have been removed.</p>';
      }

      function renderItem(item) {
        var title = item.title || (type === 'file' ? 'Download' : '');
        var url = item.url || item.movieUrl || item.songUrl || '';
        document.getElementById('title').textContent = title;
        var body = document.getElementById('body');
        var host = '';
        if (!isDl) {
          if (type === 'audio' && url) {
            host = '<audio class="poster" controls autoplay src="' + escapeHtml(url) + '"></audio>';
          } else if (type === 'video' && url) {
            host = '<video class="poster" controls autoplay playsinline src="' + escapeHtml(url) + '"></video>';
          } else if (type === 'file' && url) {
            host = '<a class="poster" href="' + escapeHtml(url) + '" target="_blank" rel="noopener">Open link</a>';
          }
        } else {
          if (url) {
            host = '<a class="poster" id="dlbtn" href="' + escapeHtml(url) + '" download>Download</a>';
          }
        }
        body.innerHTML = host + '<div class="brand">Azim\'s Space</div>';
        if (isDl) {
          var a = document.getElementById('dlbtn');
          if (a) { a.textContent = 'Download'; }
        }
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
    })();
  </script>
</body>
</html>
